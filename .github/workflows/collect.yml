name: 문화행사 데이터 수집

on:
  schedule:
    # 매일 새벽 5시 17분(한국 시간) = UTC 20:17
    - cron: '17 20 * * *'
  workflow_dispatch: # Actions 탭에서 "Run workflow" 버튼으로 바로 실행

permissions:
  contents: write

concurrency:
  group: collect-events
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: 데이터 수집
        env:
          KOPIS_KEY: ${{ secrets.KOPIS_KEY }}
          CULTURE_KEY: ${{ secrets.CULTURE_KEY }}
          SEOUL_KEY: ${{ secrets.SEOUL_KEY }}
          ENABLE_SCRAPING: ${{ vars.ENABLE_SCRAPING || 'true' }}
        run: npm run collect

      - name: 바뀐 내용이 있으면 저장소에 올리기
        run: |
          if git diff --quiet -- events.json && git ls-files --error-unmatch events.json >/dev/null 2>&1; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.json
          git commit -m "데이터 자동 갱신 $(date +'%Y-%m-%d %H:%M')"
          git push
