name: 문화행사 데이터 수집

on:
  schedule:
    # 매일 새벽 5시 17분(한국 시간) = UTC 20:17
    - cron: '17 20 * * *'
  workflow_dispatch: # Actions 탭에서 "Run workflow" 버튼으로 바로 실행

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: 데이터 수집
        env:
          KOPIS_KEY: ${{ secrets.KOPIS_KEY }}
          CULTURE_KEY: ${{ secrets.CULTURE_KEY }}
          SEOUL_KEY: ${{ secrets.SEOUL_KEY }}
          ENABLE_SCRAPING: 'false' # 민간 사이트(allgongyeon.com 등) 수집 중단(2026-11-26, 저작권·DB권 검토)
        run: npm run collect

      - name: 도서관 행사 지도 자료에서 끝난 행사 정리
        run: node scripts/prune-library-events.mjs

      - name: 바뀐 내용이 있으면 저장소에 올리기
        run: |
          git add events.json library-events.json
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "데이터 자동 갱신 $(date +'%Y-%m-%d %H:%M')"
          git pull --rebase
          git push
